name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # catalog-svc's integration tests start OpenSearch in a container (Testcontainers).
      - name: Allow OpenSearch's memory maps
        run: sudo sysctl -w vm.max_map_count=262144

      # spotlessCheck, javac -Werror, Error Prone, unit, contract and Testcontainers tests, JaCoCo.
      - run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  compose:
    name: validate compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/compose/compose.yaml --profile full config --quiet
      - name: SLO rules compile and their alert tests pass
        run: |
          docker run --rm -v "$PWD/deploy/compose/prometheus:/rules:ro" -w /rules --entrypoint promtool \
            prom/prometheus:v3.16.0 check rules slo.rules.yml
          docker run --rm -v "$PWD/deploy/compose/prometheus:/rules:ro" -w /rules --entrypoint promtool \
            prom/prometheus:v3.16.0 test rules slo.rules.test.yml

  web:
    name: web (typecheck and build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vite build
