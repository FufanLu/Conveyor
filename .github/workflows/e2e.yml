name: e2e

# The whole platform on one runner, driven by a real browser: every compose service, all eight
# Conveyor services with tracing to Jaeger, Debezium connectors, the production web build. A
# browser signs in on Keycloak, buys, follows the saga and a courier live, sees a declined card,
# and the ops view; then the trace of the order is read back from Jaeger and catalog-svc is
# frozen to watch the circuit breaker. On demand: it needs most of the runner's 16 GB.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    name: browser journey on the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: gradle/actions/setup-gradle@v6

      - name: Allow OpenSearch's memory maps
        run: sudo sysctl -w vm.max_map_count=262144

      - run: ./gradlew assemble

      - name: Journey, trace, chaos
        run: tools/e2e/run.sh | tee e2e-results.txt

      - if: always()
        run: docker compose -f deploy/compose/compose.yaml --profile full logs --no-color > build/e2e/logs/compose.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e
          path: |
            e2e-results.txt
            build/e2e/
