name: bench

# Benchmarks run on demand, on a fresh GitHub-hosted runner: no other workload shares the
# machine, which a developer laptop cannot promise. Results are printed in the log and uploaded.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds per (strategy, concurrency)
        default: "2"
      concurrency:
        description: Concurrency levels
        default: "16 64 256"

permissions:
  contents: read

jobs:
  hot-sku:
    name: hot SKU strategies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bench -d bench" --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :services:inventory-svc:bootJar

      - name: Run the matrix
        env:
          ROUNDS: ${{ inputs.rounds }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: tools/bench/hot-sku-matrix.sh | tee hot-sku-results.txt

      - uses: actions/upload-artifact@v7
        with:
          name: hot-sku-results
          path: hot-sku-results.txt
