# Single source of truth for versions. Spring Boot's BOM manages most runtime libraries
# (gRPC, protobuf, Kafka client, Jackson, Micrometer, Testcontainers ...); only what the BOM
# does not cover is pinned here.

[versions]
java = "25"
spring-boot = "4.1.2"
spring-cloud = "2025.1.4"   # compatible with Spring Boot >=4.0.0 <4.2.0-M1
protobuf = "4.36.2"         # must match protobuf-java managed by the Boot BOM
grpc = "1.84.1"             # must match grpc-java managed by the Boot BOM
errorprone = "2.52.0"
palantir-java-format = "2.103.0"
jacoco = "0.8.16"
archunit = "1.5.1"
opensearch-java = "3.10.0"
temporal = "1.40.0"
aws-sdk = "2.57.10"
resilience4j = "2.4.0"
aws-cdk = "2.275.0"
constructs = "10.8.1"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
opensearch-java = { module = "org.opensearch.client:opensearch-java", version.ref = "opensearch-java" }
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }
# Temporal pulls protobuf-java-util 3.25; keep it in step with the protobuf runtime the Boot BOM manages.
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-micrometer = { module = "io.github.resilience4j:resilience4j-micrometer", version.ref = "resilience4j" }
aws-cdk-lib = { module = "software.amazon.awscdk:aws-cdk-lib", version.ref = "aws-cdk" }
constructs = { module = "software.constructs:constructs", version.ref = "constructs" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
protoc-gen-grpc-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }

# Gradle plugins, consumed as dependencies by the build-logic convention plugins.
gradle-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
gradle-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version = "8.11.0" }
gradle-errorprone = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version = "5.2.0" }
gradle-protobuf = { module = "com.google.protobuf:protobuf-gradle-plugin", version = "0.10.1" }
