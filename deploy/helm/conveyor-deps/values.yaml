# Each entry becomes a Deployment and a Service with the same name. ConfigMaps named under
# configMaps are created from the compose files by deploy/kind/up.sh, so compose stays the one
# source for realm, init SQL and connector configs.
deps:
  postgres-0:
    image: postgres:18.6-alpine
    args: ["-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10",
           "-c", "max_connections=200", "-c", "shared_buffers=128MB"]
    ports: { postgres: 5432 }
    env: { POSTGRES_USER: conveyor, POSTGRES_PASSWORD: conveyor, POSTGRES_DB: conveyor }
    configMaps: [{ name: conveyor-pg0-init, mountPath: /docker-entrypoint-initdb.d }]
    memory: 512Mi
  postgres-1:
    image: postgres:18.6-alpine
    args: ["-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10",
           "-c", "max_connections=200", "-c", "shared_buffers=128MB"]
    ports: { postgres: 5432 }
    env: { POSTGRES_USER: conveyor, POSTGRES_PASSWORD: conveyor, POSTGRES_DB: conveyor }
    configMaps: [{ name: conveyor-pg1-init, mountPath: /docker-entrypoint-initdb.d }]
    memory: 512Mi
  redis:
    image: redis:8.8.4-alpine
    args: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: { redis: 6379 }
    memory: 320Mi
  kafka:
    image: apache/kafka:4.4.0
    ports: { kafka: 9092 }
    env:
      CLUSTER_ID: MlhFkI2CV8WMdkM85-e5zA
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    memory: 768Mi
  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    ports: { http: 8083 }
    env:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: conveyor-connect
      CONFIG_STORAGE_TOPIC: _connect.configs
      OFFSET_STORAGE_TOPIC: _connect.offsets
      STATUS_STORAGE_TOPIC: _connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      HEAP_OPTS: -Xms256m -Xmx512m
      CONNECT_PLUGIN_DISCOVERY: service_load
    configMaps: [{ name: conveyor-connectors, mountPath: /setup }]
    memory: 768Mi
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    args: ["start-dev", "--http-port=8080", "--health-enabled=true", "--import-realm"]
    ports: { http: 8080 }
    env:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
    configMaps: [{ name: conveyor-realm, mountPath: /opt/keycloak/data/import }]
    memory: 768Mi
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    ports: { http: 9200 }
    env:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    memory: 1536Mi
  temporal:
    image: temporalio/temporal:1.10.0
    args: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0",
           "--db-filename", "/tmp/temporal.db", "--namespace", "conveyor"]
    ports: { grpc: 7233, ui: 8233 }
    memory: 384Mi
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    args: ["-Xmx256m", "-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: { http: 8000 }
    memory: 384Mi
