# helm test conveyor: a customer's token from Keycloak, an order through the gateway, and the
# saga's verdict read back: the whole write path (gateway -> order-svc -> outbox -> Debezium ->
# Kafka -> fulfillment-svc -> Temporal -> inventory-svc + payment-mock -> order-svc) in the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: conveyor-smoke
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  enableServiceLinks: false
  containers:
    - name: smoke
      image: {{ .Values.smoke.image }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          token=$(curl -fsS {{ .Values.endpoints.issuer }}/protocol/openid-connect/token \
            -d grant_type=password -d client_id=conveyor-cli -d username=alice -d password=alice \
            | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          [ -n "$token" ] || { echo "no token"; exit 1; }
          order=$(curl -sS -w '\n%{http_code}' -X POST http://gateway:8080/api/v1/orders \
            -H "Authorization: Bearer $token" -H "Idempotency-Key: smoke-$(date +%s)-$$" \
            -H 'Content-Type: application/json' \
            -d '{"items":[{"sku":"B09E3779B1","quantity":1}],"shipToRegion":"us-east"}')
          echo "POST /api/v1/orders -> $(echo "$order" | tail -n1): $(echo "$order" | head -n1)"
          [ "$(echo "$order" | tail -n1)" = "201" ] || exit 1
          id=$(echo "$order" | sed -n 's/.*"orderId":"\([^"]*\)".*/\1/p')
          echo "placed $id"
          for i in $(seq 1 60); do
            status=$(curl -fsS http://gateway:8080/api/v1/orders/$id -H "Authorization: Bearer $token" \
              | sed -n 's/.*"status":"\([A-Z_]*\)".*/\1/p')
            echo "after ${i}s: $status"
            [ "$status" = "CONFIRMED" ] && exit 0
            [ "$status" != "PLACED" ] && exit 1
            sleep 2
          done
          exit 1
