global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Spring Boot services started on the host (./gradlew :services:<name>:bootRun).
  - job_name: conveyor-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { service: gateway }
      - targets: ["host.docker.internal:8081"]
        labels: { service: catalog-svc }
      - targets: ["host.docker.internal:8082"]
        labels: { service: order-svc }
      - targets: ["host.docker.internal:8083"]
        labels: { service: inventory-svc }
      - targets: ["host.docker.internal:8084"]
        labels: { service: fulfillment-svc }
      - targets: ["host.docker.internal:8085"]
        labels: { service: tracking-svc }
      - targets: ["host.docker.internal:8086"]
        labels: { service: payment-mock }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
