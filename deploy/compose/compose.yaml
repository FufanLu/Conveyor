# Local infrastructure for Conveyor.
#
#   docker compose -f deploy/compose/compose.yaml up -d                      # core only
#   docker compose -f deploy/compose/compose.yaml --profile search up -d     # core + OpenSearch
#   docker compose -f deploy/compose/compose.yaml --profile full up -d       # everything
#
# Services without a profile (Postgres x2, Redis, Kafka) always start. Every other piece is
# behind a profile so a laptop with an 8 GB Docker VM only runs what the current milestone
# needs. Every container has a memory limit; docs/architecture.md has the
# measured footprint. Image tags are pinned exactly, never "latest".
#
# Profiles: search | workflow | events | auth | aws | obs | tools | full

name: conveyor

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

x-postgres: &postgres
  image: postgres:18.6-alpine
  # wal_level=logical lets Debezium read the outbox table from the WAL (M2).
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=10
    - -c
    - max_connections=200
    - -c
    - shared_buffers=128MB
  environment:
    POSTGRES_USER: conveyor
    POSTGRES_PASSWORD: conveyor
    POSTGRES_DB: conveyor
  healthcheck:
    <<: *healthcheck
    test: ["CMD-SHELL", "pg_isready -U conveyor -d conveyor"]
  mem_limit: 512m

services:
  # ---------------------------------------------------------------- core (always on)

  # Two physical Postgres instances. order-svc shards orders across both (ShardingSphere,
  # 16 logical shards, M2). pg-0 also hosts the single-instance databases.
  postgres-0:
    <<: *postgres
    ports: ["5432:5432"]
    volumes:
      - pg0-data:/var/lib/postgresql
      - ./postgres/init-pg0.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro

  postgres-1:
    <<: *postgres
    ports: ["5433:5432"]
    volumes:
      - pg1-data:/var/lib/postgresql
      - ./postgres/init-pg1.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro

  # Cache, idempotency fast-path and (M3) bucketed inventory counters. AOF on: the inventory
  # buckets can be rebuilt from the Postgres ledger, but rebuilding is slow at peak.
  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    mem_limit: 320m

  # Single-node KRaft broker (no ZooKeeper). Two listeners: kafka:19092 inside the compose
  # network, localhost:9092 for services started on the host with ./gradlew bootRun.
  kafka:
    image: apache/kafka:4.4.0
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: MlhFkI2CV8WMdkM85-e5zA   # base64 of a fixed UUID; KRaft needs a stable cluster id
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly with chosen partition counts (keyed by order or
      # shipment id), never implicitly by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *healthcheck
      interval: 10s
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    mem_limit: 768m

  # ---------------------------------------------------------------- search (M1)

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    profiles: [search, full]
    # Host port is configurable: on a shared workstation 9200 is often taken by something else.
    # A process bound to 127.0.0.1:9200 wins over Docker's *:9200 for IPv4 clients (Java), while
    # IPv6-first clients (curl) still reach OpenSearch, so the clash is easy to miss.
    ports: ["${CONVEYOR_OPENSEARCH_PORT:-9200}:9200"]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      <<: *healthcheck
      interval: 10s
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null"]
    # 512 MiB heap + direct buffers + page cache for the index: measured 976 MiB with the
    # 100k-product index loaded, so 1 GiB was too tight.
    mem_limit: 1536m

  # ---------------------------------------------------------------- workflow (M4)

  # Temporal dev server: frontend gRPC on 7233, web UI on 8233, SQLite persistence. Same
  # server and SDK protocol as a production cluster, at a fraction of the memory.
  temporal:
    image: temporalio/temporal:1.10.0
    profiles: [workflow, full]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db", "--namespace", "conveyor"]
    ports: ["7233:7233", "8233:8233"]
    volumes:
      # The image runs as uid 1000; a named volume over its home directory inherits that owner
      # (one over a fresh path like /var/temporal would be root-owned and SQLite could not open it).
      - temporal-data:/home/temporal
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
    mem_limit: 384m

  # ---------------------------------------------------------------- events (M2)

  # Kafka Connect with Debezium: reads the order outbox table from the Postgres WAL and
  # publishes one Kafka record per outbox row (outbox event router SMT).
  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    profiles: [events, full]
    depends_on:
      kafka: { condition: service_healthy }
      postgres-0: { condition: service_healthy }
      postgres-1: { condition: service_healthy }
    ports: ["8183:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: conveyor-connect
      CONFIG_STORAGE_TOPIC: _connect.configs
      OFFSET_STORAGE_TOPIC: _connect.offsets
      STATUS_STORAGE_TOPIC: _connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx512m
      # Find plugins through their ServiceLoader manifests instead of scanning every class on
      # the plugin path (KIP-898). Worker startup measured 127 s with scanning on a loaded laptop.
      CONNECT_PLUGIN_DISCOVERY: service_load
    volumes:
      - ./connect:/setup:ro   # connector configs + register.sh (make connectors)
    healthcheck:
      <<: *healthcheck
      interval: 10s
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/ > /dev/null"]
    mem_limit: 768m

  # Schema registry for the Protobuf event contracts. kafkasql storage keeps the registry's
  # state in a Kafka topic, so it survives container restarts without another database.
  schema-registry:
    image: apicurio/apicurio-registry:3.3.4
    profiles: [events, full]
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8181:8080"]
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:19092
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m
    healthcheck:
      <<: *healthcheck
      interval: 10s
      # Apicurio 3 (Quarkus) serves health on its management port 9000, not on 8080.
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health/ready > /dev/null"]
    mem_limit: 512m

  # ---------------------------------------------------------------- auth (M1)

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [auth, full]
    # Imports deploy/compose/keycloak/conveyor-realm.json on first start: realm "conveyor",
    # roles customer / catalog-admin, users alice/alice and ops/ops (development only).
    # The realm file must not define a top-level clientScopes array: that replaces Keycloak's
    # built-in scopes (basic, profile, roles), and tokens silently lose sub, preferred_username
    # and realm_access. The audience mapper therefore sits on each client instead.
    command: ["start-dev", "--http-port=8080", "--health-enabled=true", "--import-realm"]
    ports: ["8180:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
    healthcheck:
      <<: *healthcheck
      interval: 10s
      # The image ships without curl; speak HTTP over bash's /dev/tcp to the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
    mem_limit: 768m

  # ---------------------------------------------------------------- aws (M5)

  # Official DynamoDB Local. Shipment tracking events and idempotency records use the real
  # DynamoDB API (AWS SDK v2), so the same code runs against the managed service.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    profiles: [aws, full]
    command: ["-Xmx256m", "-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]
    mem_limit: 384m

  # ---------------------------------------------------------------- obs (M7 grows this)

  # Scrapes the services' /actuator/prometheus. Services run on the host during development,
  # hence host.docker.internal (mapped explicitly so it also resolves on Linux CI).
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [obs, full]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready > /dev/null"]
    mem_limit: 384m

  # Traces: Jaeger v2 takes OTLP over HTTP on 4318 and serves its UI on 16686. Services export
  # to it when started with CONVEYOR_TRACING_EXPORT=true.
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    profiles: [obs, full]
    ports: ["4318:4318", "16686:16686"]
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [obs, full]
    depends_on:
      prometheus: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null"]
    mem_limit: 256m

  # ---------------------------------------------------------------- tools

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [tools, full]
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8280:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: conveyor
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      JAVA_OPTS: -Xms128m -Xmx256m
    mem_limit: 384m

volumes:
  pg0-data:
  pg1-data:
  redis-data:
  kafka-data:
  opensearch-data:
  temporal-data:
  prometheus-data:
  grafana-data:
