# kind on one 16 GB machine: the middleware takes ~6.4 GB, so every service runs one replica
# (HPA floor 1) instead of the chart's two. Everything else is the production chart unchanged.
services:
  gateway: { hpa: { min: 1, max: 3 } }
  catalog-svc: { hpa: { min: 1, max: 3 } }
  order-svc: { hpa: { min: 1, max: 3 } }
  inventory-svc: { hpa: { min: 1, max: 3 } }
  fulfillment-svc: { hpa: { min: 1, max: 3 } }
  tracking-svc: { hpa: { min: 1, max: 3 } }
