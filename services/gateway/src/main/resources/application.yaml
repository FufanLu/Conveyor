# Platform defaults (actuator, metrics, logging) come from libs/platform.
spring:
  application:
    name: gateway
  data:
    redis:
      host: ${CONVEYOR_REDIS_HOST:localhost}
      port: 6379
      timeout: 100ms
      connect-timeout: 250ms
  security:
    oauth2:
      resourceserver:
        jwt:
          # Discovered lazily on the first request that carries a token.
          issuer-uri: http://localhost:8180/realms/conveyor
          # Tokens must be issued for Conveyor, not just by the same Keycloak realm.
          audiences: conveyor-api
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Fail fast instead of queueing behind a sick upstream (Builders' Library:
            # "Timeouts, retries, and backoff with jitter"). Per-route budgets come in M7.
            connect-timeout: 1000
            response-timeout: 5s
          # Which peers may hand us X-Forwarded-* / Forwarded headers: in production, the load
          # balancer's address range. Everyone else (locally: every client) is untrusted, so the
          # gateway drops whatever such a client sent and writes its own X-Forwarded-For, -Proto
          # and -Prefix (/api, from StripPrefix). Services use the prefix to rebuild public paths.
          # Unset, the gateway sends no X-Forwarded headers at all.
          trusted-proxies: ${CONVEYOR_TRUSTED_PROXIES:^10\.255\.255\.254$}
          routes:
            - id: catalog
              uri: ${conveyor.upstreams.catalog}
              predicates:
                - Path=/api/v1/products/**,/api/v1/search/**
              filters:
                - StripPrefix=1
                # Browsing: 50 requests/s per customer or address, bursts to 100.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalOrAddress}"
                    redis-rate-limiter.replenishRate: ${conveyor.gateway.rate.browse:50}
                    redis-rate-limiter.burstCapacity: ${conveyor.gateway.rate.browse-burst:100}
            - id: orders
              uri: ${conveyor.upstreams.order}
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=1
                # Orders: 10 requests/s per customer, bursts to 20 (the order page polls
                # once a second; a script placing orders in a loop is what this stops).
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalOrAddress}"
                    redis-rate-limiter.replenishRate: ${conveyor.gateway.rate.orders:10}
                    redis-rate-limiter.burstCapacity: ${conveyor.gateway.rate.orders-burst:20}
            - id: ops-orders
              uri: ${conveyor.upstreams.order}
              predicates:
                - Path=/api/v1/ops/orders/**
              filters:
                - StripPrefix=1
            - id: delivery-promises
              uri: ${conveyor.upstreams.fulfillment}
              predicates:
                - Path=/api/v1/delivery-promises/**
              filters:
                - StripPrefix=1
            # Shipment state and its SSE stream. Streams stay open for minutes, so this route
            # (and the ops map below) turns the global 5 s response timeout off.
            - id: shipments
              uri: ${conveyor.upstreams.tracking}
              predicates:
                - Path=/api/v1/shipments/**
              filters:
                - StripPrefix=1
              metadata:
                response-timeout: -1
            - id: ops-map
              uri: ${conveyor.upstreams.tracking}
              predicates:
                - Path=/api/v1/ops/map
              filters:
                - StripPrefix=1
              metadata:
                response-timeout: -1

server:
  port: 8080
  # The edge: never take X-Forwarded-* from clients at face value (see platform defaults).
  forward-headers-strategy: none

# Upstream base URLs. Override per environment, e.g. CONVEYOR_UPSTREAMS_ORDER=http://order-svc:8082.
# inventory-svc and payment-mock are internal only and have no public route.
conveyor:
  upstreams:
    catalog: http://localhost:8081
    order: http://localhost:8082
    fulfillment: http://localhost:8084
    tracking: http://localhost:8085
  # Edge admission (LoadSheddingFilter): an adaptive concurrency limit shared by all routes;
  # search may use 50 % of it, product pages 80 %, orders 100 %.
  gateway:
    shedding:
      enabled: true
      initial-limit: 64

# Rate limiting fails open when Redis is down (every request allowed), so Redis is not a
# reason to take the gateway out of rotation: its health indicator stays off.
management:
  health:
    redis:
      enabled: false
