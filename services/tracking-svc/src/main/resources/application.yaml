# Platform defaults (actuator, metrics, virtual threads, logging) come from libs/platform.
spring:
  application:
    name: tracking-svc
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      compression-type: lz4
      batch-size: 65536
      properties:
        linger.ms: 5
        max.block.ms: 2000
        enable.idempotence: true
    listener:
      ack-mode: batch
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/conveyor
          audiences: conveyor-api

server:
  port: 8085

conveyor:
  tracking:
    dynamo-endpoint: ${CONVEYOR_DYNAMODB_URL:http://localhost:8000}
